version: '3.8'

services:
  byeboros-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: byeboros-backend-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./service_account.json:/app/service_account.json:ro
    depends_on:
      - whisper-stt
    restart: unless-stopped

  # Self-hosted speech-to-text (whisper.cpp server, OpenAI-compatible).
  # Built from source so it runs on arm64 as well as amd64.
  # Download the model first: make stt-model  (see Makefile)
  whisper-stt:
    build:
      context: .
      dockerfile: Dockerfile.stt
    image: byeboros-whisper-stt
    container_name: byeboros-whisper
    volumes:
      - ./models:/models
    command:
      - --model
      - /models/ggml-base.bin
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --inference-path
      - /inference
      - --threads
      - "4"
      - --print-progress
    expose:
      - "8080"
    restart: unless-stopped

networks:
  default:
    external: true
    name: npm-net


